<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rosa Bonita</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#0f172a);
    overflow:hidden;
}

.rose{
    position:relative;
    width:250px;
    height:450px;
    animation:sway 4s ease-in-out infinite;
    transform-origin:bottom center;
}

/* Pétalos */
.petal{
    position:absolute;
    width:90px;
    height:120px;
    background:linear-gradient(145deg,#ff4d6d,#b3003c);
    border-radius:50% 50% 45% 45%;
    top:80px;
    left:80px;
    box-shadow:
        inset -10px -10px 20px rgba(0,0,0,.25),
        0 0 25px rgba(255,50,100,.5);
}

.p1{ transform:rotate(-35deg) translate(-35px,-10px);}
.p2{ transform:rotate(35deg) translate(35px,-10px);}
.p3{ transform:rotate(0deg) translateY(-30px);}
.p4{ transform:rotate(-70deg) translate(-45px,25px);}
.p5{ transform:rotate(70deg) translate(45px,25px);}

.center{
    position:absolute;
    width:70px;
    height:70px;
    background:#80002a;
    border-radius:50%;
    top:115px;
    left:90px;
    box-shadow:0 0 20px rgba(0,0,0,.4);
}

/* Tallo */
.stem{
    position:absolute;
    width:12px;
    height:230px;
    background:linear-gradient(to right,#14532d,#22c55e);
    top:180px;
    left:119px;
    border-radius:20px;
}

/* Hojas */
.leaf{
    position:absolute;
    width:75px;
    height:40px;
    background:linear-gradient(135deg,#22c55e,#166534);
    border-radius:100% 0 100% 0;
    box-shadow:0 0 10px rgba(34,197,94,.5);
}

.left{
    top:260px;
    left:50px;
    transform:rotate(-35deg);
}

.right{
    top:320px;
    left:125px;
    transform:rotate(145deg);
}

/* Brillo */
.glow{
    position:absolute;
    width:180px;
    height:180px;
    background:radial-gradient(circle,
    rgba(255,80,120,.35),
    transparent 70%);
    top:40px;
    left:35px;
    animation:pulse 2s infinite;
}

/* Animaciones */
@keyframes sway{
    0%,100%{transform:rotate(-3deg);}
    50%{transform:rotate(3deg);}
}

@keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.1);}
}
</style>
</head>

<body>

<div class="rose">
    <div class="glow"></div>

    <div class="petal p1"></div>
    <div class="petal p2"></div>
    <div class="petal p3"></div>
    <div class="petal p4"></div>
    <div class="petal p5"></div>

    <div class="center"></div>

    <div class="stem"></div>

    <div class="leaf left"></div>
    <div class="leaf right"></div>
</div>

</body>
</html>
